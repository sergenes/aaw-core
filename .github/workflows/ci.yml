# Build, lint, test, and scan for secrets. Never deploys anything.
# Fork pull requests get no repository secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: tmux (the end-to-end host test needs it)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q tmux; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew list tmux >/dev/null 2>&1 || brew install -q tmux; fi
          tmux -V
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,relay]"
      - run: ruff check .
      - run: pytest -q
      - run: aaw --version

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
